[package]
name = "inazuma-core"
version = "0.1.0"
edition = "2021"
description = "Inazuma L1 — a from-scratch blockchain node. INAZ is the native and staking coin."

[[bin]]
name = "inazuma"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
getrandom = "0.2"
bs58 = "0.5"
wasmi = "0.31"
wat = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.13"

[profile.release]
opt-level = 3
